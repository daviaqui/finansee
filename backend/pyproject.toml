[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "finansee-api"
version = "1.0.0"
description = "API do FinanSee, um gerenciador financeiro pessoal."
requires-python = ">=3.12"
dependencies = [
  "alembic==1.19.1",
  "email-validator==2.2.0",
  "fastapi==0.141.1",
  "psycopg[binary]==3.2.13",
  "pydantic-settings==2.7.1",
  "pyjwt==2.10.1",
  "pwdlib[argon2]==0.2.1",
  "sqlalchemy==2.0.52",
  "uvicorn[standard]==0.34.0",
]

[project.optional-dependencies]
dev = [
  "aiosqlite==0.21.0",
  "httpx2==2.12.0",
  "pytest==8.3.4",
  "pytest-cov==6.0.0",
  "ruff==0.9.7",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
